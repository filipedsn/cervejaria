# CI remoto (repo público + plano Free).
# Branch protection em main exige o check "build-and-unit".
# Gate local `npm run ci` + atestado continua válido; este workflow espelha o núcleo Linux.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Reutilizado pela esteira "Deploy PRD (VPS)" para testar o SHA exato que será publicado.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cervejaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cervejaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            ops-panel/package-lock.json

      - name: Install root
        run: npm ci

      - name: Install backend
        run: npm ci --prefix backend

      - name: Install frontend
        run: npm ci --prefix frontend

      # Prisma pinado em backend/; CWD precisa ser backend/ (schema em ./prisma).
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Migrations aplicam do zero (Postgres 16)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/cervejaria?schema=public
        run: npx --no-install prisma migrate deploy

      # known-drift.sql = divergência histórica (constraints/índices só em SQL) entre migrations e
      # schema.prisma. Qualquer diferença nova significa schema.prisma alterado sem migration (ou o
      # contrário). Ao corrigir de propósito, regenere o arquivo com o mesmo comando.
      - name: schema.prisma coerente com as migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/cervejaria?schema=public
        run: |
          npx --no-install prisma migrate diff --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/drift.sql"
          if ! diff -u prisma/known-drift.sql "$RUNNER_TEMP/drift.sql"; then
            echo "::error::schema.prisma e migrations divergem além do known-drift.sql. Gere a migration (npm run db:migrate) ou atualize o known-drift.sql se a mudança for intencional."
            exit 1
          fi

      - name: Backend unit tests
        run: npm run test:unit --prefix backend

      - name: Backend typecheck/build
        run: npm run build:deploy --prefix backend

      - name: Frontend build
        run: npm run build:deploy --prefix frontend

      - name: Ops panel unit tests
        run: |
          npm ci --prefix ops-panel
          npm run test:unit --prefix ops-panel
