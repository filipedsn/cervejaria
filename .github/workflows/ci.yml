# CI remoto — plano Free (repo privado).
# Branch protection de verdade exige GitHub Pro ou repo público (API 403 no Free).
# Gate local `npm run ci` + atestado continua válido; este workflow espelha o núcleo Linux.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root
        run: npm ci

      - name: Install backend
        run: npm ci --prefix backend

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Prisma generate
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Backend unit tests
        run: npm run test:unit --prefix backend

      - name: Backend typecheck/build
        run: npm run build:deploy --prefix backend

      - name: Frontend build
        run: npm run build:deploy --prefix frontend
