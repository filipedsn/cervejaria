# CI remoto (repo público + plano Free).
# Branch protection em main exige o check "build-and-unit".
# Gate local `npm run ci` + atestado continua válido; este workflow espelha o núcleo Linux.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Reutilizado pela esteira "Deploy PRD (VPS)" para testar o SHA exato que será publicado.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root
        run: npm ci

      - name: Install backend
        run: npm ci --prefix backend

      - name: Install frontend
        run: npm ci --prefix frontend

      # Prisma pinado em backend/; CWD precisa ser backend/ (schema em ./prisma).
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend unit tests
        run: npm run test:unit --prefix backend

      - name: Backend typecheck/build
        run: npm run build:deploy --prefix backend

      - name: Frontend build
        run: npm run build:deploy --prefix frontend
