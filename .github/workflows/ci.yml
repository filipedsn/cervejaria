# TAP-116: GitHub Actions desligado no repositorio (billing).
# A fonte de verdade e `npm run ci` local + deploy/.local-ci-attestation.json.
# workflow_dispatch permanece so para reativacao manual consciente; nao dispara em push/PR.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled:
    name: actions-disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain local CI gate
        run: |
          echo "GitHub Actions esta desligado para este repositorio (TAP-116)."
          echo "Rode npm run ci localmente. O deploy exige deploy/.local-ci-attestation.json."
          exit 1
