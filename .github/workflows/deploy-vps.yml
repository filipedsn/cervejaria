# Esteira de produção do Quiver Tap: CI → build da imagem → aprovação humana → deploy no VPS.
#
# - Todo push na main dispara CI + build e para no gate do environment "production"
#   (required reviewer). Nada chega ao VPS sem aprovação explícita no GitHub.
# - Execução manual (workflow_dispatch) publica o HEAD da main ou um SHA específico
#   da main (rollback intencional).
# - Acesso ao VPS só pela tailnet (tag:ci); a porta 22 continua fechada na internet.
#   A chave SSH do CI tem forced command (deploy-gate.sh): não abre shell.
# - Secrets/variables ficam só no environment "production" (liberados após aprovação).
# Runbook: docs/handoff-vps-hostinger-arquiteto.md §7.1.
name: Deploy PRD (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA da main a publicar (vazio = HEAD da main). Use um SHA antigo para rollback."
        type: string
        required: false
        default: ""
      allow_destructive:
        description: "Autorizo migrations destrutivas (DROP/RENAME/TYPE/NOT NULL/DELETE) — fase contract, já revisada."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve-sha
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      mode: ${{ steps.sha.outputs.mode }}
      destructive_flag: ${{ steps.migrations.outputs.flag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver SHA candidato
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            sha="$(git rev-parse --verify "${INPUT_SHA}^{commit}")"
            mode=allow-older
          else
            sha="$GITHUB_SHA"
            mode=head-only
          fi
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha não pertence à main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### Candidato a PRD"
            echo "- SHA: \`$sha\` ($mode)"
            echo "- Commit: $(git log -1 --format='%s' "$sha")"
          } >> "$GITHUB_STEP_SUMMARY"

      # Prévia contra o SHA que está em PRD agora. O VPS repete a checagem contra o
      # RELEASE_SHA real no momento do deploy (é lá que a decisão vale).
      - name: Migrations até o candidato
        id: migrations
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive && 'true' || 'false' }}
        run: |
          set -uo pipefail
          health="$(curl -fsS -H 'Cache-Control: no-cache' "https://tap.quivercloud.com.br/api/health?ts=$(date +%s)" || true)"
          prd="$(printf '%s' "$health" | sed -n 's/.*"releaseSha":"\([0-9a-f]\{40\}\)".*/\1/p')"
          flag=""
          [ "$ALLOW_DESTRUCTIVE" = "true" ] && flag="allow-destructive"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          if [ -z "$prd" ] || ! git cat-file -e "${prd}^{commit}" 2>/dev/null; then
            echo "::warning::Não deu para ler o releaseSha de PRD; o VPS fará a checagem de migrations no deploy."
            exit 0
          fi
          out="$(bash deploy/tap-quiver/migration-guard.sh "$prd" "$SHA")"
          code=$?
          {
            echo "### Migrations (PRD \`${prd:0:12}\` → \`${SHA:0:12}\`)"
            if [ -z "$out" ]; then echo "- nenhuma"; else printf '%s\n' "$out" | sed 's/^/- /'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$out" ] && printf '%s\n' "$out"
          case "$code" in
            0) ;;
            3)
              if [ "$ALLOW_DESTRUCTIVE" != "true" ]; then
                echo "::error::Há migration destrutiva. Revise (expand/contract) e rode o workflow manualmente com allow_destructive=true."
                exit 1
              fi
              echo "::warning::Migration destrutiva autorizada por allow_destructive=true." ;;
            4) echo "::error::Migration já publicada foi alterada/removida; crie uma nova migration."; exit 1 ;;
            *) echo "::error::migration-guard falhou (código $code)."; exit 1 ;;
          esac

  ci:
    name: ci
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    name: docker-build-sha
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (tag = SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tap-quiver/Dockerfile
          target: runner
          push: false
          load: true
          tags: quiver-tap-api:${{ needs.resolve.outputs.sha }}

      - name: Build migrator (Prisma CLI + migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tap-quiver/Dockerfile
          target: migrator
          push: false
          load: true
          tags: quiver-tap-migrator:${{ needs.resolve.outputs.sha }}

  deploy:
    name: deploy-prd
    needs: [resolve, ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://tap.quivercloud.com.br
    concurrency:
      group: deploy-prd-vps
      cancel-in-progress: false
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MODE: ${{ needs.resolve.outputs.mode }}
      DESTRUCTIVE_FLAG: ${{ needs.resolve.outputs.destructive_flag }}
    steps:
      - name: Conferir secrets do environment
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TAILSCALE_IP: ${{ secrets.VPS_TAILSCALE_IP }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
        run: |
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET VPS_SSH_KEY VPS_TAILSCALE_IP VPS_SSH_HOST_KEY; do
            [ -n "${!name}" ] || { echo "::error::Falta $name no environment production"; missing=1; }
          done
          exit $missing

      - name: Entrar na tailnet (tag:ci)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_TAILSCALE_IP }}

      - name: Configurar SSH (host key fixada)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TAILSCALE_IP: ${{ secrets.VPS_TAILSCALE_IP }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          printf '%s %s\n' "$VPS_TAILSCALE_IP" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host quiver-vps
            HostName $VPS_TAILSCALE_IP
            User root
            IdentityFile ~/.ssh/vps_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Deploy no VPS
        id: deploy
        run: |
          set +e
          # shellcheck disable=SC2029
          ssh quiver-vps "deploy $SHA $MODE $DESTRUCTIVE_FLAG"
          code=$?
          case "$code" in
            5)
              echo "::warning::$SHA não é mais o HEAD da main; deploy ignorado (um run mais novo publica o HEAD)."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            6) echo "::error::Deploy recusado antes de mexer em PRD (migration destrutiva sem autorização, migration alterada ou RELEASE_SHA ausente). Veja o log acima." ;;
          esac
          exit "$code"

      - name: Smoke público
        if: steps.deploy.outputs.superseded != 'true'
        run: |
          for _ in $(seq 1 12); do
            body="$(curl -fsS -H 'Cache-Control: no-cache' "https://tap.quivercloud.com.br/api/health?ts=$(date +%s)" || true)"
            if printf '%s' "$body" | grep -q "\"releaseSha\":\"$SHA\""; then
              echo "health: $body"
              curl -fsS -o /dev/null -w "ready:%{http_code}\n" "https://tap.quivercloud.com.br/api/ready?ts=$(date +%s)"
              {
                echo "### PRD publicado"
                echo "- SHA: \`$SHA\`"
                echo "- https://tap.quivercloud.com.br/api/health → releaseSha confere"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://tap.quivercloud.com.br não respondeu com releaseSha=$SHA"
          exit 1

      - name: Remover chave do runner
        if: always()
        run: rm -f ~/.ssh/vps_deploy
