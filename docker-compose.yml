services:
  postgres:
    image: postgres:16-alpine
    container_name: cervejaria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cervejaria
      POSTGRES_PASSWORD: cervejaria123
      POSTGRES_DB: cervejaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervejaria -d cervejaria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
