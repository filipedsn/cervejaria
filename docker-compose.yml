services:
  postgres:
    image: postgres:16-alpine
    container_name: cervejaria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cervejaria
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD:?POSTGRES_PROD_PASSWORD must be set}
      POSTGRES_DB: cervejaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervejaria -d cervejaria"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-dev:
    image: postgres:16-alpine
    container_name: cervejaria-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: cervejaria
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?POSTGRES_DEV_PASSWORD must be set}
      POSTGRES_DB: cervejaria_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervejaria -d cervejaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_dev_data:
