# TAP-96 example only. Merge this fragment with the current Collector configuration;
# this is not loaded by docker-compose or any release.
# Requires a persistent writable volume at /var/lib/otelcol and an explicit rollout decision.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 256

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    # Per bbolt DB file, not a complete volume quota.
    max_size: 134217728
    fsync: true

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    api_key: ${env:ELASTIC_API_KEY_COLLECTOR}
    mapping:
      mode: otel
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 67108864
      storage: file_storage
      block_on_overflow: false
    retry:
      enabled: true
      max_retries: 1000
      initial_interval: 1s
      max_interval: 30s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
