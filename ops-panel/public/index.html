<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiver Tap Ops</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>Quiver Tap <span>Ops</span></h1>
      <div class="top-meta">
        <span id="updated" aria-live="polite">carregando…</span>
        <button type="button" id="refresh" class="ghost">Atualizar</button>
      </div>
    </header>

    <main>
      <section id="verdict" class="verdict" data-level="off" aria-live="polite">
        <div>
          <p id="verdict-text" class="verdict-text">Lendo o estado dos ambientes…</p>
          <ul id="verdict-extra" class="verdict-extra"></ul>
        </div>
        <div id="next" class="next"></div>
      </section>

      <section aria-label="Trilho da entrega">
        <ol id="line" class="line"></ol>
      </section>

      <div class="areas">
        <section class="area" id="card-git" aria-labelledby="h-git"></section>
        <section class="area" id="card-dev" aria-labelledby="h-dev"></section>
        <section class="area" id="card-pipeline" aria-labelledby="h-pipeline"></section>
        <section class="area" id="card-prd" aria-labelledby="h-prd"></section>
      </div>

      <section class="log" aria-labelledby="h-log">
        <h2 id="h-log">Ações feitas pelo painel</h2>
        <ol id="audit"></ol>
      </section>
    </main>

    <dialog id="modal">
      <form method="dialog">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <p id="modal-error" class="error" hidden></p>
        <div class="modal-actions">
          <button type="submit" value="cancel" class="ghost">Cancelar</button>
          <button type="button" id="modal-confirm" class="primary"></button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
