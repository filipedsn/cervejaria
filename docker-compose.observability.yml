# EDOT Collector — recebe OTLP do Quiver Tap e envia para Elasticsearch existente.
# Rede: elasticsearch-kibana_elastic (mesma do container elasticsearch).

services:
  edot-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    container_name: quiver-edot-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    env_file:
      - deploy/observability/.env.observability
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - elastic

networks:
  elastic:
    external: true
    name: elasticsearch-kibana_elastic
