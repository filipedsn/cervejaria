# Staging Quiver Tap no VPS — valida por http://VPS_IP:3001
name: tap-quiver

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/tap-quiver/Dockerfile
    image: quiver-tap-api:staging
    container_name: cervejaria-api
    restart: unless-stopped
    # Host network: o guard PDV_CANONICAL_ALL exige DATABASE_URL em 127.0.0.1:5432/cervejaria
    network_mode: host
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      FRONTEND_DIST: /app/frontend-dist
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  uploads_data:
    external: true
    name: vps_uploads_data