receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/fallback:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil
    trace_statements:
      - context: span
        statements:
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    mapping:
      mode: otel
    logs_dynamic_index:
      enabled: true
    metrics_dynamic_index:
      enabled: true
    traces_dynamic_index:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/fallback, batch]
      exporters: [elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [transform/fallback, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [transform/fallback, batch]
      exporters: [elasticsearch]
