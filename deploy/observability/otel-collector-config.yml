receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  httpcheck:
    collection_interval: 60s
    targets:
      - endpoint: http://host.docker.internal:3001/api/ready
        method: GET
      - endpoint: http://host.docker.internal:3002/api/ready
        method: GET
      - endpoint: https://tapdev.quivercloud.com.br/api/ready
        method: GET

  tcpcheck:
    collection_interval: 60s
    initial_delay: 5s
    targets:
      - endpoint: host.docker.internal:5432
        dialer:
          timeout: 5s
      - endpoint: host.docker.internal:5434
        dialer:
          timeout: 5s

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
          system.disk.operations:
            enabled: false
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      paging:
        metrics:
          system.paging.utilization:
            enabled: true

processors:
  filter/dev-only:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["data_stream.namespace"] == "prd"'
    metrics:
      metric:
        - 'resource.attributes["data_stream.namespace"] == "prd"'
    logs:
      log_record:
        - 'resource.attributes["data_stream.namespace"] == "prd"'

  transform/namespace:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "quarantine") where attributes["data_stream.namespace"] == nil
      - context: log
        statements:
          - set(attributes["data_stream.namespace"], "quarantine") where resource.attributes["data_stream.namespace"] == "quarantine"
    trace_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "quarantine") where attributes["data_stream.namespace"] == nil
      - context: span
        statements:
          - set(attributes["data_stream.namespace"], "quarantine") where resource.attributes["data_stream.namespace"] == "quarantine"
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "quarantine") where attributes["data_stream.namespace"] == nil
      - context: datapoint
        statements:
          - set(attributes["data_stream.namespace"], "quarantine") where resource.attributes["data_stream.namespace"] == "quarantine"

  transform/metric-identity:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["quiver.metric.name"], metric.name)

  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  transform/infra:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "infra")
          - set(attributes["deployment.environment.name"], "infra")
          - set(attributes["service.name"], "quiver-tap-infra")

  filter/infra-allowlist:
    error_mode: ignore
    metrics:
      include:
        match_type: regexp
        metric_names:
          - httpcheck.*
          - tcpcheck.*
          - system.cpu.utilization
          - system.memory.utilization
          - system.disk.io
          - system.filesystem.utilization
          - system.paging.utilization
          - system.cpu.load_average.*

  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 15

  batch:
    timeout: 5s
    send_batch_size: 256

extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    api_key: ${env:ELASTIC_API_KEY_COLLECTOR}
    # External rollout must install this pipeline first. Not applied live by TAP-96 DEV.
    pipeline: quiver-observability-ingested
    batcher:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 1
      storage: file_storage
    retry:
      enabled: true
      max_retries: 100
      initial_interval: 1s
      max_interval: 10s
      retry_on_status: [429, 502, 503, 504]
    mapping:
      mode: otel
    logs_dynamic_index:
      enabled: true
    metrics_dynamic_index:
      enabled: true
    traces_dynamic_index:
      enabled: true

service:
  extensions: [file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/namespace, tail_sampling, batch]
      exporters: [elasticsearch]
    metrics/app:
      receivers: [otlp]
      processors: [memory_limiter, transform/namespace, transform/metric-identity, batch]
      exporters: [elasticsearch]
    metrics/infra:
      receivers: [httpcheck, tcpcheck, hostmetrics]
      processors: [memory_limiter, transform/infra, filter/infra-allowlist, transform/metric-identity, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/namespace, batch]
      exporters: [elasticsearch]
