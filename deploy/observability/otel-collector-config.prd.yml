# Collector PRD (VPS) — espelho do DEV com filtro invertido:
# só deixa passar namespace prd / deployment.environment=production.
# Infra (httpcheck/tcpcheck/hostmetrics) permanece em data_stream.namespace=infra.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  httpcheck:
    collection_interval: 60s
    targets:
      - endpoint: http://host.docker.internal:3001/api/ready
        method: GET
      - endpoint: http://host.docker.internal:3001/
        method: GET
      - endpoint: https://tap.quivercloud.com.br/api/ready
        method: GET

  tcpcheck:
    collection_interval: 60s
    initial_delay: 5s
    targets:
      - endpoint: cervejaria-db:5432
        dialer:
          timeout: 5s

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
          system.disk.operations:
            enabled: false
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      paging:
        metrics:
          system.paging.utilization:
            enabled: true

  # Logs do host montados em /var/log/host (somente leitura). Query string fora da URL: pode carregar tokens.
  filelog/nginx:
    include: [/var/log/host/nginx/access.log]
    start_at: end
    operators:
      - type: regex_parser
        regex: '^(?P<edge_ip>\S+) \S+ (?P<remote_user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>[A-Z]+) (?P<path>[^ "?]+)(?:\?[^ "]*)? (?P<proto>[^"]+)" (?P<status>\d{3}) (?P<bytes>\d+) "(?P<referer>[^"]*)" "(?P<ua>[^"]*)"'
        timestamp:
          parse_from: attributes.time
          layout_type: strptime
          layout: '%d/%b/%Y:%H:%M:%S %z'
        on_error: send_quiet
      - type: move
        from: attributes.method
        to: attributes["http.request.method"]
        if: 'attributes.method != nil'
      - type: move
        from: attributes.path
        to: attributes["url.path"]
        if: 'attributes.path != nil'
      - type: move
        from: attributes.status
        to: attributes["http.response.status_code"]
        if: 'attributes.status != nil'
      - type: move
        from: attributes.ua
        to: attributes["user_agent.original"]
        if: 'attributes.ua != nil'
      - type: move
        from: attributes.edge_ip
        to: attributes["source.address"]
        if: 'attributes.edge_ip != nil'
      - type: remove
        field: attributes.time
        if: 'attributes.time != nil'
      - type: add
        field: attributes["data_stream.dataset"]
        value: nginx_access

  filelog/ssh:
    include: [/var/log/host/auth.log]
    start_at: end
    operators:
      - type: filter
        expr: 'not (body matches "sshd")'
      - type: regex_parser
        regex: '(?P<ssh_event>Failed password|Failed publickey|Invalid user|Accepted publickey|Accepted password|Connection closed by authenticating user|Disconnected from authenticating user)(?: for)?(?: invalid user)? ?(?P<ssh_user>\S+)? from (?P<src_ip>[0-9a-fA-F:.]+)'
        on_error: send_quiet
      - type: move
        from: attributes.ssh_event
        to: attributes["ssh.event"]
        if: 'attributes.ssh_event != nil'
      - type: move
        from: attributes.ssh_user
        to: attributes["user.name"]
        if: 'attributes.ssh_user != nil'
      - type: move
        from: attributes.src_ip
        to: attributes["source.address"]
        if: 'attributes.src_ip != nil'
      - type: add
        field: attributes["data_stream.dataset"]
        value: ssh_auth

  filelog/docker:
    include: [/var/log/host/quiver-docker-state.log]
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.ts
          layout_type: gotime
          layout: '2006-01-02T15:04:05Z07:00'
        on_error: send_quiet
      - type: add
        field: attributes["data_stream.dataset"]
        value: docker_state

  filelog/backup:
    include: [/var/log/host/quiver-backup-status.log]
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.ts
          layout_type: gotime
          layout: '2006-01-02T15:04:05Z07:00'
        on_error: send_quiet
      - type: add
        field: attributes["data_stream.dataset"]
        value: backup_status

processors:
  transform/dataset:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["data_stream.dataset"], "technical")
          - set(attributes["data_stream.dataset"], "audit") where attributes["event.category"] == "audit"
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.dataset"], "generic")
    trace_statements:
      - context: span
        statements:
          - set(attributes["data_stream.dataset"], "generic")
      - context: resource
        statements:
          - set(attributes["data_stream.dataset"], "generic")

  filter/prd-only:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'
    metrics:
      metric:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'
    logs:
      log_record:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'

  transform/namespace:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil
    trace_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil

  transform/infra:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "infra")
          - set(attributes["deployment.environment.name"], "infra")
          - set(attributes["service.name"], "quiver-tap-infra")

  transform/infra-logs:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "infra")
          - set(attributes["deployment.environment.name"], "infra")
          - set(attributes["service.name"], "quiver-tap-infra")
      - context: log
        statements:
          - set(attributes["http.response.status_code"], Int(attributes["http.response.status_code"])) where attributes["http.response.status_code"] != nil
          - set(attributes["http.response.body.bytes"], Int(attributes["bytes"])) where attributes["bytes"] != nil
          - delete_key(attributes, "bytes")

  filter/infra-allowlist:
    error_mode: ignore
    metrics:
      include:
        match_type: regexp
        metric_names:
          - httpcheck.*
          - tcpcheck.*
          - system.cpu.utilization
          - system.memory.utilization
          - system.disk.io
          - system.filesystem.utilization
          - system.paging.utilization
          - system.cpu.load_average.*

  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      # 100%: toda transação fica registrada (tráfego baixo; retenção de traces PRD é de 7 dias).
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 100

  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_URL}
    # Chave so de escrita (deploy/observability/roles/quiver-collector-prd-key.json); nunca o superusuario.
    api_key: ${env:ELASTIC_API_KEY}
    mapping:
      mode: otel
    logs_dynamic_index:
      enabled: true
    metrics_dynamic_index:
      enabled: true
    traces_dynamic_index:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, tail_sampling, batch]
      exporters: [elasticsearch]
    metrics/app:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, batch]
      exporters: [elasticsearch]
    metrics/infra:
      receivers: [httpcheck, tcpcheck, hostmetrics]
      processors: [transform/infra, filter/infra-allowlist, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, batch]
      exporters: [elasticsearch]
    logs/infra:
      receivers: [filelog/nginx, filelog/ssh, filelog/docker, filelog/backup]
      processors: [transform/infra-logs, batch]
      exporters: [elasticsearch]
