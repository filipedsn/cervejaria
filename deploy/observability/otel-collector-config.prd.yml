# Collector PRD (VPS) — espelho do DEV com filtro invertido:
# só deixa passar namespace prd / deployment.environment=production.
# Infra (httpcheck/tcpcheck/hostmetrics) permanece em data_stream.namespace=infra.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  httpcheck:
    collection_interval: 60s
    targets:
      - endpoint: http://host.docker.internal:3001/api/ready
        method: GET
      - endpoint: http://host.docker.internal:3001/
        method: GET

  tcpcheck:
    collection_interval: 60s
    initial_delay: 5s
    targets:
      - endpoint: host.docker.internal:5432
        dialer:
          timeout: 5s

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
          system.disk.operations:
            enabled: false
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      paging:
        metrics:
          system.paging.utilization:
            enabled: true

processors:
  transform/dataset:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(attributes["data_stream.dataset"], "technical")
          - set(attributes["data_stream.dataset"], "audit") where attributes["event.category"] == "audit"
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.dataset"], "generic")
    trace_statements:
      - context: span
        statements:
          - set(attributes["data_stream.dataset"], "generic")
      - context: resource
        statements:
          - set(attributes["data_stream.dataset"], "generic")

  filter/prd-only:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'
    metrics:
      metric:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'
    logs:
      log_record:
        - 'resource.attributes["data_stream.namespace"] != "prd"'
        - 'resource.attributes["deployment.environment.name"] == "development"'

  transform/namespace:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil
    trace_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "production"
          - set(attributes["data_stream.namespace"], "dev") where attributes["data_stream.namespace"] == nil and attributes["deployment.environment.name"] == "development"
          - set(attributes["data_stream.namespace"], "prd") where attributes["data_stream.namespace"] == nil

  transform/infra:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["data_stream.namespace"], "infra")
          - set(attributes["deployment.environment.name"], "infra")
          - set(attributes["service.name"], "quiver-tap-infra")

  filter/infra-allowlist:
    error_mode: ignore
    metrics:
      include:
        match_type: regexp
        metric_names:
          - httpcheck.*
          - tcpcheck.*
          - system.cpu.utilization
          - system.memory.utilization
          - system.disk.io
          - system.filesystem.utilization
          - system.paging.utilization
          - system.cpu.load_average.*

  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 15

  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  elasticsearch:
    endpoint: ${env:ELASTICSEARCH_URL}
    user: ${env:ELASTIC_USER}
    password: ${env:ELASTIC_PASSWORD}
    mapping:
      mode: otel
    logs_dynamic_index:
      enabled: true
    metrics_dynamic_index:
      enabled: true
    traces_dynamic_index:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, tail_sampling, batch]
      exporters: [elasticsearch]
    metrics/app:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, batch]
      exporters: [elasticsearch]
    metrics/infra:
      receivers: [httpcheck, tcpcheck, hostmetrics]
      processors: [transform/infra, filter/infra-allowlist, batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [transform/namespace, filter/prd-only, transform/dataset, batch]
      exporters: [elasticsearch]
