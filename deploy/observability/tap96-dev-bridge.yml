# Temporary DEV-only bridge, not part of the shared Collector deployment.
# Bind host ports to loopback; use its own queue volume and resource limits.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152
extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  filter/dev-fence:
    error_mode: propagate
    logs:
      log_record:
        - 'resource.attributes["data_stream.namespace"] != "dev"'
    traces:
      span:
        - 'resource.attributes["data_stream.namespace"] != "dev"'
    metrics:
      metric:
        - 'resource.attributes["data_stream.namespace"] != "dev"'
  transform/metric-identity:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["quiver.metric.name"], metric.name)
exporters:
  otlphttp/shared:
    endpoint: http://host.docker.internal:4318
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 1
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 0s
service:
  extensions: [file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/dev-fence]
      exporters: [otlphttp/shared]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/dev-fence]
      exporters: [otlphttp/shared]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/dev-fence, transform/metric-identity]
      exporters: [otlphttp/shared]
